<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Add Student</h1>

        <p class="subtitle">Enter Student Details</p>

        <input type="text" id="roll" placeholder="Roll Number">
        <br><br>

        <input type="text" id="name" placeholder="Student Name">
        <br><br>

        <input type="number" id="c" placeholder="C Marks">
        <br><br>

        <input type="number" id="cpp" placeholder="C++ Marks">
        <br><br>

        <input type="number" id="python" placeholder="Python Marks">
        <br><br>

        <input type="number" id="dbms" placeholder="DBMS Marks">
        <br><br>

        <input type="number" id="ai" placeholder="AI Marks">
        <br><br>

        <button onclick="addStudent()">
            Add Student
        </button>

        <div id="message"></div>

        <br>

        <button onclick="location.href='admin-dashboard.html'">
            Back to Dashboard
        </button>

    </div>

    <script>
        async function addStudent() {

            const data = new URLSearchParams();

            data.append("roll",
                document.getElementById("roll").value);

            data.append("name",
                document.getElementById("name").value);

            data.append("c",
                document.getElementById("c").value);

            data.append("cpp",
                document.getElementById("cpp").value);

            data.append("python",
                document.getElementById("python").value);

            data.append("dbms",
                document.getElementById("dbms").value);

            data.append("ai",
                document.getElementById("ai").value);

            const response = await fetch("/api/add", {
                method: "POST",
                body: data
            });

            const result = await response.json();

if (response.ok) {
    document.getElementById("message").innerHTML =
        "<p>Student added successfully</p>";
} else {
    document.getElementById("message").innerHTML =
        "<p>" + result.message + "</p>";
}
        }
    </script>

</body>
</html>
